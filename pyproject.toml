[build-system]
requires = ["cython", "setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "samosa_waveform_model"
description = "SAMOSA(+) radar altimeter waveform model"
readme = "README.md"
version = "0.2"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = []
authors = [
  { name = "Stefan Hendricks", email = "stefan.hendricks@awi.de" },
]
classifiers = [
  "Topic :: Scientific/Engineering",
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]

dependencies = [
    "bottleneck",
    "numpy",
    "pandas",
    "pydantic",
    "pyyaml",
    "scipy"
]

[project.optional-dependencies]
tests = [
    "flake8",
    "isort",
    "pytest",
    "coverage"
]
dev = [
    "matplotlib",
    "notebook",
    "ipykernel"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"samosa_waveform_model.resources" = ["*.txt", "*.csv", "*.md", "*.yaml"]
